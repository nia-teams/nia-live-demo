<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <title>Nia Live</title>
    <link rel="icon" type="image/png" href="/nia-avatar-circle.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --ink: #eef2ff;
        --muted: #9aa7c2;
        --accent: #6ea8ff;
        --glow: 93, 202, 165;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        background: linear-gradient(180deg, #111625 0%, #090c14 62%, #05070b 100%);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @keyframes liveSpin {
        to {
          transform: rotate(360deg);
        }
      }
      #layout {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      /* ── 1. Full-Screen Canvas Stage ───────────────────────────────────── */
      #stage {
        position: relative;
        flex: 1 1 0%;
        min-height: 0;
        width: 100%;
        overflow: hidden;
      }
      /* ── 2. Bottom Status + Subtitle Band + Voice Controls (Teams aligned) ─ */
      #live-footer {
        position: relative;
        z-index: 20;
        display: flex;
        flex-shrink: 0;
        flex-direction: column;
        gap: 8px;
        padding: 8px 16px 36px;
      }
      #bottom-status {
        display: flex;
        height: 24px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 8px;
        text-align: center;
      }
      #agent-activity-pill {
        display: none;
        max-width: 100%;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 9999px;
        padding: 2px 12px;
        font-size: 11px;
        background: rgba(15, 20, 34, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #85B7EB;
      }
      #agent-activity-pill[data-visible] {
        display: inline-flex;
      }
      #agent-activity-pill svg {
        width: 10px;
        height: 10px;
        flex-shrink: 0;
        animation: liveSpin 1s linear infinite;
      }
      #agent-activity-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
      }
      #status-text {
        display: block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 500;
        color: #9aa7c2;
      }
      #status-text[data-hidden] {
        display: none;
      }
      #status-text[data-error] {
        color: #F09595;
      }
      /* ── Subtitle Box (Teams recentTranscripts slice(-4)) ──────────────── */
      #transcript-box {
        display: none;
        max-height: 112px;
        flex-direction: column;
        justify-content: flex-end;
        gap: 4px;
        overflow-y: auto;
        border-radius: 16px;
        padding: 8px 14px;
        font-size: 12px;
        line-height: 20px;
        background: rgba(11, 13, 18, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #transcript-box[data-visible] {
        display: flex;
      }
      .transcript-line {
        line-height: 1.375;
        word-break: break-word;
      }
      .transcript-who {
        margin-right: 6px;
        font-weight: 600;
      }
      .transcript-who.user {
        color: #85B7EB;
      }
      .transcript-who.assistant {
        color: #5DCAA5;
      }
      .transcript-text {
        color: #eef2ff;
      }
      /* ── Voice Control Buttons Row (56px circles, 32px gap) ─────────────── */
      #controls-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding-top: 4px;
      }
      .ctrl-btn {
        position: relative;
        display: flex;
        width: 56px;
        height: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        padding: 0;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .ctrl-btn:active {
        transform: scale(0.95);
      }
      .ctrl-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .ctrl-btn[data-hidden] {
        display: none !important;
      }
      #mic-btn {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #eef2ff;
      }
      #mic-btn[data-muted] {
        background: rgba(240, 149, 149, 0.22);
        border-color: rgba(255, 255, 255, 0.18);
        color: #F09595;
      }
      #mic-halo {
        pointer-events: none;
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 1.5px solid rgba(93, 202, 165, 0.72);
        box-shadow: 0 0 14px rgba(93, 202, 165, 0.35);
        opacity: 0.18;
        transition: transform 75ms ease-out, opacity 75ms ease-out;
      }
      #mic-btn[data-muted] #mic-halo {
        display: none;
      }
      #mic-icon-on {
        position: relative;
        z-index: 10;
        display: flex;
        width: 24px;
        height: 24px;
        align-items: center;
        justify-content: center;
      }
      #mic-icon-off {
        position: relative;
        z-index: 10;
        display: none;
        width: 24px;
        height: 24px;
      }
      #mic-btn[data-muted] #mic-icon-on {
        display: none;
      }
      #mic-btn[data-muted] #mic-icon-off {
        display: block;
      }
      #start-btn {
        background: #22c55e;
        border: 0;
        color: #ffffff;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.35);
      }
      #connecting-btn {
        background: rgba(245, 158, 11, 0.24);
        border: 1.5px solid rgba(251, 191, 36, 0.65);
        color: #fde68a;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.35);
      }
      #connecting-spinner {
        pointer-events: none;
        position: absolute;
        inset: 4px;
        width: 46px;
        height: 46px;
        animation: liveSpin 1s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="layout" data-testid="live-voice-page">
      <main id="stage" data-state="idle">
      </main>

      <footer id="live-footer">
        <div id="bottom-status" data-testid="live-voice-bottom-status">
          <div id="agent-activity-pill" data-testid="live-voice-agent-activity">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M12 2a10 10 0 0 1 10 10" />
            </svg>
            <span id="agent-activity-text"></span>
          </div>
          <span id="status-text" data-testid="live-voice-status-text">点击下方按钮开始通话</span>
        </div>

        <div id="transcript-box" data-testid="live-voice-transcripts" aria-live="polite"></div>

        <div id="controls-row">
          <!-- Left: Mute Microphone (visible when connected) -->
          <button
            id="mic-btn"
            type="button"
            class="ctrl-btn"
            data-hidden
            data-testid="live-voice-mute"
            aria-pressed="false"
            aria-label="静音麦克风"
            title="静音麦克风"
          >
            <span id="mic-halo" data-testid="live-voice-wave" aria-hidden="true"></span>
            <span id="mic-icon-on">
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                style="pointer-events:none;position:absolute;inset:0;width:24px;height:24px;"
              >
                <defs>
                  <clipPath id="live-mic-capsule-clip">
                    <rect x="8.25" y="2.25" width="7.5" height="12" rx="3.75" />
                  </clipPath>
                </defs>
                <rect
                  id="mic-fill"
                  data-testid="live-voice-mic-fill"
                  clip-path="url(#live-mic-capsule-clip)"
                  x="8.25"
                  y="11.85"
                  width="7.5"
                  height="2.4"
                  fill="#5DCAA5"
                />
              </svg>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                aria-hidden="true"
                style="position:relative;z-index:10;width:24px;height:24px;"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z"
                />
              </svg>
            </span>
            <svg
              id="mic-icon-off"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M18.364 18.364A9 9 0 0 0 5.636 5.636m12.728 12.728A9 9 0 0 1 5.636 5.636m12.728 12.728L5.636 5.636"
              />
            </svg>
          </button>

          <!-- Center 1: Start Call (visible when idle / ended / error) -->
          <button
            id="start-btn"
            type="button"
            class="ctrl-btn"
            data-testid="live-voice-start"
            aria-label="开始语音"
            title="开始语音"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              aria-hidden="true"
              style="width:28px;height:28px;"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"
              />
            </svg>
          </button>

          <!-- Center 2: Connecting / Cancel (visible while connecting) -->
          <button
            id="connecting-btn"
            type="button"
            class="ctrl-btn"
            data-hidden
            data-testid="live-voice-connecting"
            aria-label="取消连接"
            title="取消连接"
          >
            <svg
              id="connecting-spinner"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M12 2a10 10 0 0 1 10 10" />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              aria-hidden="true"
              style="position:relative;z-index:10;width:24px;height:24px;"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 3.75 18 6m0 0 2.25 2.25M18 6l2.25-2.25M18 6l-2.25 2.25m1.5 13.5c-8.284 0-15-6.716-15-15V4.5A2.25 2.25 0 0 1 4.5 2.25h1.372c.516 0 .966.351 1.091.852l1.106 4.423c.11.44-.054.902-.417 1.173l-1.293.97a1.062 1.062 0 0 0-.38 1.21 12.035 12.035 0 0 0 7.143 7.143c.441.162.928-.004 1.21-.38l.97-1.293a1.125 1.125 0 0 1 1.173-.417l4.423 1.106c.5.125.852.575.852 1.091V19.5a2.25 2.25 0 0 1-2.25 2.25h-2.25Z"
              />
            </svg>
          </button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
